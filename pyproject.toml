[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "grok-judge-bridge"
version = "0.2.0"
description = "TypeSafe-shaped judgments through a dedicated Grok Bot, with MCP, CLI and Python interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "kaitoflow"}]
dependencies = [
  "system-one-adapter>=0.2.1,<0.3",
  "typesafe-sdk>=0.7.5,<0.8",
  "mcp>=1.20,<2",
  "filelock>=3.20,<4",
  "jsonschema>=4.23,<5",
  "starlette>=0.49,<2",
  "uvicorn>=0.35,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "build>=1"]

[project.scripts]
grok-judge = "grok_judge_bridge.cli:main"

[project.urls]
Repository = "https://github.com/kaitoflow/grok-judge-bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_judge_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: sends real requests to the configured Grok Bot (explicit opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
